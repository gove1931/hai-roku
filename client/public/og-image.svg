<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>

  <!-- Decorative circle -->
  <circle cx="980" cy="120" r="200" fill="#863bff" opacity="0.06"/>
  <circle cx="980" cy="120" r="130" fill="#863bff" opacity="0.06"/>

  <!-- Mahjong tile icon -->
  <g transform="translate(90, 185)">
    <rect x="0" y="0" width="120" height="160" rx="12" fill="#1e1030" stroke="#863bff" stroke-width="2" stroke-opacity="0.6"/>
    <text x="60" y="100" font-family="'Helvetica Neue', Arial, 'Noto Sans JP', sans-serif" font-size="64" font-weight="700" fill="#863bff" text-anchor="middle" opacity="0.9">中</text>
  </g>

  <!-- App name -->
  <text x="280" y="255" font-family="'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="700" fill="white" letter-spacing="-3">牌録</text>

  <!-- Description -->
  <text x="282" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" fill="white" opacity="0.65">麻雀収支管理アプリ</text>

  <!-- Divider -->
  <line x1="282" y1="368" x2="1100" y2="368" stroke="#863bff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Tags -->
  <rect x="282" y="393" width="80" height="36" rx="18" fill="#863bff" opacity="0.2"/>
  <text x="322" y="416" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#863bff" text-anchor="middle">PWA</text>
  <rect x="378" y="393" width="90" height="36" rx="18" fill="#863bff" opacity="0.2"/>
  <text x="423" y="416" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#863bff" text-anchor="middle">Vite</text>

  <!-- URL -->
  <text x="1100" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="white" opacity="0.35" text-anchor="end">hai-roku.goveapp.com</text>
</svg>
